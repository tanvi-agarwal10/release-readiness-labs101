name: Release Pipeline

on:
  push:
    branches:
      - main
      - investigation/release-readiness

jobs:
  validate-release:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --prefix app

      - name: Run Tests and Validation
        run: npm test --prefix app

  deploy-production:
    name: Deploy to Production (Protected)
    runs-on: ubuntu-latest
    needs: validate-release
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Release Version
        run: |
          echo "Target Release: OrderFlow v2.3.0"
          echo "Environment: production (gated by manual approval)"

      - name: Safe Dry-Run (No Production Deployment)
        run: |
          echo "Production deployment is intentionally disabled for this assignment."
          echo "Dry-run validation successful. No production resources modified."
